name: Quality & Security

on:
  pull_request:
  push:
    branches:
      - main
      - claude/fight-training-camp-app-ggs3g

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, unit tests, security regressions, type checks and production build
        run: npm run quality

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
