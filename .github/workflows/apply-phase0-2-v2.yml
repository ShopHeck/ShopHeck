name: Apply final guarded Phase 0-2 hardening

on:
  push:
    branches:
      - agent/phase-0-2-hardening
    paths:
      - '.phase-run-v2'

permissions:
  contents: write

concurrency:
  group: apply-phase0-2-hardening
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-2-hardening
          fetch-depth: 0

      - name: Apply transformations when not already committed
        run: |
          if [ ! -f src/utils/timerMath.ts ]; then
            python3 .github/scripts/apply_phase0_2.py
          fi
          python3 .github/scripts/finalize_phase0_2.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete regression gate
        run: npm run validate

      - name: Capture production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > dependency-audit.json

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-after-hardening-v2
          retention-days: 7
          if-no-files-found: warn
          path: dependency-audit.json

      - name: Remove one-time implementation machinery
        if: success()
        run: |
          rm -rf .agent-patch
          rm -f .phase-run-v2
          rm -f .github/scripts/apply_phase0_2.py
          rm -f .github/scripts/finalize_phase0_2.py
          rm -f .github/workflows/apply-agent-patch.yml
          rm -f .github/workflows/apply-phase0-2-v2.yml
          rm -f .github/workflows/dependency-audit-report.yml
          rm -f .github/workflows/scaffold-supabase-migration.yml
          git diff --check

      - name: Commit only the verified implementation
        if: success()
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Implement security, validation, and core engine hardening"
          git push origin HEAD:agent/phase-0-2-hardening
