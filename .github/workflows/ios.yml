name: iOS Build → TestFlight

on:
  # Auto-ship every improvement: any push to the trunk branch that touches
  # app code builds and uploads a new TestFlight build. Docs-only and
  # config-only changes are filtered out so they don't burn a macOS build.
  push:
    branches:
      - claude/fight-training-camp-app-ggs3g
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig*.json'
      - '.github/workflows/ios.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Only one TestFlight build at a time. A newer push cancels an in-flight run so
# we always ship the latest commit and never race on the auto-incremented build
# number (which is derived from the highest build already on TestFlight).
concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods
        run: pod install
        working-directory: ios/App

      - name: Upload to TestFlight via Fastlane
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          # App Store Connect API key — drives both automatic signing and upload.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Production RevenueCat key injected into the Release build.
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
