name: iOS Build → TestFlight

on:
  # Auto-ship every improvement: any push to the trunk branch that touches
  # app code builds and uploads a new TestFlight build. Docs-only and
  # config-only changes are filtered out so they don't burn a macOS build.
  push:
    branches:
      - main
      - claude/fight-training-camp-app-ggs3g
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig*.json'
      - '.github/workflows/ios.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run'
        default: 'beta'
        type: choice
        options:
          - beta
          - certs   # one-time: create/refresh the shared match signing cert
      version:
        description: 'Marketing version (e.g. 1.0.2). Blank = use the committed MARKETING_VERSION.'
        type: string
        required: false

# Only one TestFlight build at a time. A newer push cancels an in-flight run so
# we always ship the latest commit and never race on the auto-incremented build
# number (which is derived from the highest build already on TestFlight).
concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every credential this app needs is baked into the binary at build time,
      # so a missing or wrong-shaped secret does not fail the build — it ships,
      # and then fails on a user's phone as "Load failed" on sign-in or
      # "Error 11: There was a credentials issue" on the paywall, neither of
      # which names its cause. Check the shapes here, before ~20 minutes of
      # macOS build time and a TestFlight release get spent on a broken binary.
      #
      # Values are only ever tested for shape and never echoed.
      - name: Preflight build secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          fail=0
          problem() { echo "::error::$1"; fail=1; }

          # Leading/trailing whitespace and wrapping quotes survive into the
          # bundle and produce a URL that fetch rejects before it reaches the
          # network. Compare against the trimmed form to catch them.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//'; }

          url_trimmed=$(trim "$VITE_SUPABASE_URL")
          key_trimmed=$(trim "$VITE_SUPABASE_ANON_KEY")
          rc_trimmed=$(trim "$REVENUECAT_API_KEY")

          if [ -z "$url_trimmed" ]; then
            problem "VITE_SUPABASE_URL is not set. Sign-in and cloud sync will be absent from this build."
          else
            if [ "$url_trimmed" != "$VITE_SUPABASE_URL" ]; then
              problem "VITE_SUPABASE_URL has surrounding whitespace or quotes — re-paste it with none."
            fi
            case "$url_trimmed" in
              https://*.*) ;;
              *) problem "VITE_SUPABASE_URL must be https://<project-ref>.supabase.co" ;;
            esac
          fi

          if [ -z "$key_trimmed" ]; then
            problem "VITE_SUPABASE_ANON_KEY is not set. Sign-in and cloud sync will be absent from this build."
          else
            if [ "$key_trimmed" != "$VITE_SUPABASE_ANON_KEY" ]; then
              problem "VITE_SUPABASE_ANON_KEY has surrounding whitespace or quotes — re-paste it with none."
            fi
            # Either a JWT (three dot-separated parts) or an sb_publishable_… key.
            case "$key_trimmed" in
              sb_*) ;;
              *.*.*) ;;
              *) problem "VITE_SUPABASE_ANON_KEY is not a recognisable Supabase key (expected a JWT or sb_publishable_…). Check for a truncated paste." ;;
            esac
          fi

          # Public RevenueCat SDK keys are platform-scoped and prefixed. iOS
          # needs the Apple one; anything else 401s at runtime as error 11.
          if [ -z "$rc_trimmed" ]; then
            problem "REVENUECAT_API_KEY is not set."
          else
            case "$rc_trimmed" in
              appl_*) ;;
              test_*) problem "REVENUECAT_API_KEY is a Test Store key (test_…), which only works in debug builds. Use the public Apple SDK key (appl_…) from RevenueCat → Project Settings → API keys." ;;
              goog_*) problem "REVENUECAT_API_KEY is the Google Play key (goog_…). iOS needs the Apple key (appl_…)." ;;
              amzn_*) problem "REVENUECAT_API_KEY is the Amazon key (amzn_…). iOS needs the Apple key (appl_…)." ;;
              rcb_*|strp_*) problem "REVENUECAT_API_KEY is a Web Billing key. iOS needs the Apple SDK key (appl_…)." ;;
              sk_*) problem "REVENUECAT_API_KEY is a *secret* key (sk_…) — server-side only. The app needs the public Apple SDK key (appl_…)." ;;
              *) problem "REVENUECAT_API_KEY does not look like an Apple SDK key (expected it to start with appl_)." ;;
            esac
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Set or correct these under Settings → Secrets and variables → Actions, then re-run." >&2
            exit 1
          fi
          echo "All build secrets present and correctly shaped."

      # Apple requires the iOS 26 SDK (Xcode 26+) for App Store uploads. The
      # runner ships several Xcode versions and may default to an older one, so
      # explicitly select the newest installed Xcode_*.app.
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Comp-account allowlist is baked into the bundle at build time
          # (src/utils/subscription.ts), so the App Review demo account must be
          # in THIS build's env — setting it only in Netlify covers the web app,
          # not the iOS binary the reviewer installs.
          VITE_COMP_PRO_EMAILS: ${{ secrets.VITE_COMP_PRO_EMAILS }}

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods
        run: pod install
        working-directory: ios/App

      # match clones the private certificates repo. Authenticating that clone
      # with a personal access token — whether in the URL or as a base64 basic-auth
      # header — makes every build depend on that token's expiry date, and the
      # failure when it lapses is an opaque "invalid credentials" from git.
      #
      # A deploy key has no expiry, is scoped to the single certs repo rather
      # than the whole account, and can be revoked without touching anything
      # else. Only the certs clone uses SSH; actions/checkout still authenticates
      # over HTTPS with its own token, so this Host block cannot affect it.
      - name: Authorize the certificates repo over SSH
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          if [ -z "$MATCH_DEPLOY_KEY" ]; then
            echo "No MATCH_DEPLOY_KEY set — skipping (match will use whatever MATCH_GIT_URL provides)."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # printf guarantees the trailing newline OpenSSH requires; a key pasted
          # without one is rejected as "invalid format" with no further detail.
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key

          # Pin GitHub's host keys from its published list rather than trusting
          # whatever ssh-keyscan happens to receive. The runner is ephemeral, so
          # known_hosts starts empty and a scan has nothing to verify against —
          # that is trust-on-first-use, and ssh-keyscan(1) warns as much. Fetching
          # over HTTPS instead means the keys arrive on a connection authenticated
          # against the system trust store, which is a real anchor.
          #
          # Fails closed. Degrading to an unverified scan would defeat the point,
          # so no keys means no clone.
          if ! curl -fsSL --retry 3 https://api.github.com/meta -o "$RUNNER_TEMP/gh-meta.json"; then
            echo "::error::Could not fetch GitHub's published SSH host keys from api.github.com"
            exit 1
          fi
          jq -r '.ssh_keys[] | "github.com \(.)"' "$RUNNER_TEMP/gh-meta.json" >> ~/.ssh/known_hosts
          if ! grep -q '^github\.com ' ~/.ssh/known_hosts; then
            echo "::error::api.github.com returned no ssh_keys — refusing to fall back to an unverified host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          # IdentitiesOnly stops ssh from offering any other key first and
          # tripping GitHub's per-account auth limit before it reaches this one.
          # StrictHostKeyChecking yes is safe now that known_hosts is pinned from
          # an authenticated source rather than populated on first sight.
          cat >> ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/match_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          echo "Deploy key installed."

      # `version:` is only appended when supplied, so scheduled/push builds keep
      # using the MARKETING_VERSION committed in the project.
      - name: Upload to TestFlight via Fastlane
        run: bundle exec fastlane ${{ github.event.inputs.lane || 'beta' }} ${{ inputs.version && format('version:{0}', inputs.version) || '' }}
        working-directory: ios
        env:
          # App Store Connect API key — drives both automatic signing and upload.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Production RevenueCat key injected into the Release build.
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          # Shared signing via fastlane match. When these are unset the Fastfile
          # falls back to automatic signing, so the pipeline keeps working until
          # they're configured (see docs/ios-signing.md).
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          # Only used when the certs repo is reached over HTTPS. With an SSH
          # deploy key (the documented setup) this secret does not exist, and the
          # Fastfile deletes the variable rather than letting match send an empty
          # Authorization header — see sanitize_match_env! in ios/fastlane/Fastfile.
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
