name: Source snapshot

on:
  push:
    branches:
      - agent/fightcamp-hardening-clean
    paths:
      - '.github/workflows/source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fightcamp-hardening-clean
      - uses: actions/upload-artifact@v4
        with:
          name: fightcamp-clean-branch-source
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !ios/App/Pods/**
