[build]
  command = "npm run build"
  publish = "dist"

# The Supabase URL is public — it ships in the client bundle as VITE_SUPABASE_URL
# and is protected by RLS, not secrecy. Without this, Netlify's secrets scanner
# flags the plain SUPABASE_URL env var's value where it legitimately appears (the
# client bundle / docs) and aborts the build. Real secrets (SUPABASE_SERVICE_ROLE_KEY,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) are intentionally NOT omitted.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Serverless functions (netlify/functions/*). The Stripe webhook lives here and
# is served at /.netlify/functions/stripe-webhook — a reserved path that is not
# affected by the SPA catch-all rewrite below.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers. These are safe for a standalone SPA and add no
# runtime cost. A Content-Security-Policy is intentionally NOT set here: it must
# be validated against the live third-party endpoints (Supabase, Anthropic,
# Fitbit, Sentry, AdSense) before enabling, or it will break those integrations.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
